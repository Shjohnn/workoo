{% extends 'base.html' %}
{% load i18n %}
{% block title %}{% trans 'Log in' %} — Workooo{% endblock %}
{% block content %}
<div class="auth-page">
    <div class="auth-card">
        <div class="auth-logo">💼 <span class="logo-text">Workooo</span></div>
        <h2>{% trans 'Sign in' %}</h2>
        {% if error %}
        <div class="alert alert-error">{{ error }}</div>
        {% endif %}
        <form method="post">
            {% csrf_token %}
            <div class="form-group">
                <label for="id_username">{% trans 'Username' %}</label>
                <input type="text" name="username" id="id_username" class="form-control" autofocus required placeholder="{% trans 'Username' %}" autocomplete="username">
            </div>
            <div class="form-group">
                <label for="id_password">{% trans 'Password' %}</label>
                <input type="password" name="password" id="id_password" class="form-control" required placeholder="••••••••" autocomplete="current-password">
            </div>
            <button type="submit" class="btn btn-primary btn-block btn-lg">{% trans 'Log in' %}</button>
        </form>
        <p class="auth-switch">{% trans 'No account?' %} <a href="{% url 'register' %}">{% trans 'Sign up' %}</a></p>
    </div>
</div>
{% endblock %}
